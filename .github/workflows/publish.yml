name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write  # required for nuget.org Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pack
        shell: bash
        run: dotnet pack dll2llm.csproj -c Release -p:Version=${GITHUB_REF_NAME#v} -o nupkg

      # Exchanges the GitHub OIDC token for a short-lived (1 hour) nuget.org API key
      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}  # nuget.org profile name, not email

      - name: Push
        shell: bash
        run: dotnet nuget push nupkg/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
