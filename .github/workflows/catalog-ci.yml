name: Catalogue build and regression tests
on:
  push:
    branches: [main, feature/git-readable-navigation, feature/native-pe-inventory]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build application
        run: dotnet build dll2llm.csproj -c Release
      - name: Build missing-dependency fixture
        run: dotnet build tests/Fixtures/Target/Target.csproj -c Release
      - name: Run regression suite
        run: dotnet run --project tests/dll2llm.Tests.csproj -c Release -- tests/Fixtures/Target/bin/Release/net10.0/Target.dll

      - name: Integrated analyze to catalogue smoke test
        shell: pwsh
        run: |
          $source = Join-Path $PWD 'tests/Fixtures/Target/bin/Release/net10.0'
          $analysis = Join-Path $env:RUNNER_TEMP 'integrated-analysis'
          $catalog = Join-Path $env:RUNNER_TEMP 'integrated-catalog'
          dotnet run --project dll2llm.csproj -c Release -- analyze --source "$source" --output "$analysis" --catalog-output "$catalog"
          if ($LASTEXITCODE -ne 0) { throw "Integrated analyze failed" }
          dotnet run --project dll2llm.csproj -c Release -- catalog --source "$catalog" --validate
          if ($LASTEXITCODE -ne 0) { throw "Integrated catalogue validation failed" }
          $report = Get-Content (Join-Path $analysis 'analysis-report.json') -Raw | ConvertFrom-Json
          if (@($report.stages | Where-Object { $_.status -eq 'failed' }).Count -gt 0) { throw "Analysis report contains failed stages" }
